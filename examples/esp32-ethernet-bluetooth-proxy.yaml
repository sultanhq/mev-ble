substitutions:
  name: ventaxia-ethernet-bluetooth-proxy
  friendly_name: Vent-Axia Ethernet Bluetooth Proxy
  board: esp32-poe-iso

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true

# Olimex ESP32-PoE-ISO / ESP32-PoE-ISO-EA.
esp32:
  board: ${board}
  variant: esp32
  framework:
    type: esp-idf

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    mode: CLK_OUT
    pin: GPIO17
  phy_addr: 0
  power_pin: GPIO12

logger:

api:
  encryption:
    key: !secret esphome_api_encryption_key

ota:
  - platform: esphome
    password: !secret esphome_ota_password

esp32_ble_tracker:

bluetooth_proxy:
  active: true
  cache_services: true
  connection_slots: 4

